
name: Build Math Mind APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MathMind_Android_Project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -o MathMind_Android_Project.zip -d extracted
          test -f extracted/MathMindAndroid/settings.gradle

      - name: Build APK
        working-directory: extracted/MathMindAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Math-Mind-APK
          path: extracted/MathMindAndroid/app/build/outputs/apk/debug/app-debug.apk
